# Every CI test runs in its own process, from a platform-specific nextest archive.
# Fail the first attempt: retries must not turn a flaky release gate green.
# scripts/nextest-summary.py preserves the failure details in the job summary.

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# hub-rs/target/nextest/ci/junit.xml
path = "junit.xml"
