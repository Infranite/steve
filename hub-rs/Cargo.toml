# Steve Hub in Rust. Same REST/SSE API, SQLite schema and config as the TypeScript Hub in ../hub;
# the contract is ~/Agents/steve-rs-plan/api-inventory.md and the e2e suite hub/test/e2e.sh.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]

# Debug and test builds keep line tables (file:line in backtraces) but not full debug info: every task
# worktree builds its own `target/`, and a test build of the workspace is about 19% smaller (ST-45).
[profile.dev]
debug = "line-tables-only"
