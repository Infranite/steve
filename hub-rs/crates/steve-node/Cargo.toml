[package]
name = "steve-node"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "A Steve Node: hosts harnesses on this machine and runs what the Hub asks (docs/hub-node-client.md). No Hub store, no business decisions."

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hex = "=0.4.3"
libc = "=0.2.191"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
steve-acp = { path = "../steve-acp" }
steve-node-api = { path = "../steve-node-api" }
steve-vault = { path = "../steve-vault" }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros", "process", "fs", "net"] }
tracing = "=0.1.44"
zeroize = "=1.9.1"

[dev-dependencies]
steve-node-api = { path = "../steve-node-api", features = ["testkit"] }
async-trait = "=0.1.92"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
