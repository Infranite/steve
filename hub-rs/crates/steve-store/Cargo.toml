[package]
name = "steve-store"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
steve-store-sqlite = { path = "../steve-store-sqlite" }
steve-types = { path = "../steve-types" }
steve-node-api = { path = "../steve-node-api" }
steve-i18n = { path = "../steve-i18n" }
rust-i18n = "=4.2.4"
# In-memory metrics (lock wait and hold per call site); the Hub installs the recorder.
metrics = "=0.24.6"
r2d2 = "=0.8.10"
r2d2_sqlite = "=0.35.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
# SQL of the storage contract, written once and rendered per backend (no driver, no runtime).
sea-query = { version = "=1.0.2", default-features = false, features = ["derive", "backend-sqlite", "with-json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["sync"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
