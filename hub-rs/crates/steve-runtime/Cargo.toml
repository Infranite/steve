[package]
name = "steve-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Steve's runtime facilities: clock, time zones, schedules, retry and rate-limit policies"

# A Node binary takes only what it needs (clock, policy); the Hub enables everything.
[features]
default = ["tz", "schedule", "policy", "due", "jobs", "machine"]
machine = []
# Shared eventual conditions for dev-dependencies only.
testkit = ["process", "tokio/process", "tokio/rt", "tokio/test-util"]
tz = ["dep:chrono", "dep:chrono-tz", "dep:iana-time-zone"]
schedule = ["tz", "dep:croner"]
policy = ["dep:backon", "dep:governor", "dep:rand"]
due = ["policy", "dep:metrics", "dep:tracing"]
# The shared DueSource contract check, for each source's tests (a dev-dependency feature).
due-contract = ["due"]
# In-process cache: the Hub turns it on, a Node does not.
cache = ["dep:moka", "dep:metrics"]
jobs = ["dep:metrics", "dep:tracing", "tokio/rt"]
# Process accounting and unified bounded subprocess execution (sync + async).
process = ["dep:libc", "dep:metrics", "dep:zeroize", "tokio/rt"]

[dependencies]
futures = "=0.3.34"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["time", "sync"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"], optional = true }
chrono-tz = { version = "=0.10.4", optional = true }
iana-time-zone = { version = "=0.1.65", optional = true }
croner = { version = "=4.0.2", optional = true }
# Retries in memory and delay jitter.
backon = { version = "=1.6.0", optional = true }
rand = { version = "=0.10.3", optional = true }
governor = { version = "=0.10.4", optional = true }
# due_loop: one lag histogram and a warning when a source fails.
metrics = { version = "=0.24.6", optional = true }
tracing = { version = "=0.1.44", optional = true }
libc = { version = "=0.2.191", optional = true }
zeroize = { version = "=1.9.1", optional = true }
moka = { version = "=0.12.16", default-features = false, features = ["future"], optional = true }

[dev-dependencies]
steve-runtime = { path = ".", features = ["due-contract", "testkit", "process"] }
tokio = { version = "=1.54.1", features = ["time", "sync", "rt", "macros", "test-util"] }
