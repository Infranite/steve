[package]
name = "steve-knowledge"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Knowledge base: sources, index, retrieval and citations"

[dependencies]
steve-store = { path = "../steve-store" }
steve-modules = { path = "../steve-modules" }
# the paste guard behind `TokenGuard`
steve-vault = { path = "../steve-vault" }
steve-i18n = { path = "../steve-i18n" }
# the scan patterns (`steve_node_api::glob`), shared with the Node that scans
steve-node-api = { path = "../steve-node-api" }
rust-i18n = "=4.2.4"
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# bounded, ordered loading in the index worker
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
html2text = "=0.17.4"
pdf-extract = "=0.12.1"
pulldown-cmark = { version = "=0.13.6", default-features = false }
quick-xml = "=0.42.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
text-splitter = { version = "=0.33.1", features = ["markdown"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
tracing = "=0.1.44"
unicode-normalization = "=0.1.26"
# the OpenViking store: synchronous HTTP on loopback (no TLS, no runtime)
ureq = { version = "=3.5.1", default-features = false, features = ["json"] }
zip = { version = "=9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
# the fake OpenViking server of tests/openviking.rs
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
