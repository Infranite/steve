[package]
name = "steve-calendar"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Calendars as data sources: the calendar.v1 profile, built-in ICS and demo sources, the read cache and its sync, read API and tools"

[dependencies]
steve-types = { path = "../steve-types" }
steve-store = { path = "../steve-store" }
steve-modules = { path = "../steve-modules" }
steve-flow = { path = "../steve-flow" }
steve-i18n = { path = "../steve-i18n" }
rust-i18n = "=4.2.4"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["json", "query"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "=0.10.4"
hex = "=0.4.3"
regex = "=1.13.1"
# the shared client of the connections (an ICS subscription is fetched with it)
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "=0.1.44"
url = "=2.5.8"
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
