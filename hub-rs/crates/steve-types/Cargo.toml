[package]
name = "steve-types"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Steve's shared contract types: ids, code values, errors and domain events; types only, no IO"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
strum = { version = "=0.28.0", features = ["derive"] }
# TypeScript bindings for the web client, generated only with the `ts` feature (and checked by its tests).
ts-rs = { version = "=12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]
