[package]
name = "steve-types"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Steve's shared contract types: ids, code values, errors and domain events; types only, no IO"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# Only for the opaque `RawJson` payload; contract types never hold a parsed `Value`.
serde_json = { version = "=1.0.154", features = ["raw_value"] }
strum = { version = "=0.28.0", features = ["derive"] }

[dev-dependencies]
# TypeScript bindings for the web client: types derive `TS` under `cfg(test)`, so the workspace tests
# generate them and compare with the committed files.
ts-rs = "=12.0.1"
