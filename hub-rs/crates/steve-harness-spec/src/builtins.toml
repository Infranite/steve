state = {"env" = "VIBE_HOME", "default" = ".vibe", "import" = ["config.toml"], "extra_dirs" = [".config/vibe"]}
native_approval = "ask_owner"
modes = {"plan" = "", "ask" = "ask", "accept_edits" = "accept-edits", "auto" = "smart-approve", "full_access" = "auto-approve"}
blind_set_mode = false
native_execution = false
permission_policy = "acp"
require_mcp_http = false
mode_meta = {}
session_meta = "none"
launch_extra = "none"
probe_initialize = true
usage_input_includes_cache = true
usage_prompt_cumulative = true
usage_fallback = "none"
fallback_models = ["mistral-medium-3.5"]
fallback_efforts = []
model_fallback = false
fast_models = ["small", "ministral", "codestral", "flash", "mini", "haiku"]
resume_cli = "vibe --resume {id}"
outer_sandbox_args = []

