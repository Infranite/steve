id = "kiro"
name = "Kiro CLI"
install_hint = "curl -fsSL https://cli.kiro.dev/install | bash"
cli_bin = "kiro-cli"
detect_bins = []
args = ["acp", "--agent-engine=v3"]
command_var = "STEVE_ADAPTER_KIRO"
env = {"KIRO_NO_AUTO_UPDATE" = "1"}
command = {"kind" = "path", "bin" = "kiro-cli"}
local_transcript = false
primary = false
managed_by_default = false
[adapters.properties]
self_read_only = false
nested_sandbox = true
state = {"env" = "KIRO_HOME", "default" = ".kiro", "import" = ["settings/cli.json", "settings/permissions.yaml"], "extra_dirs" = ["Library/Application Support/kiro-cli", ".local/share/kiro-cli", ".config/Kiro", ".config/kiro", "Library/Application Support/Kiro"]}
modes = {"plan" = "planner", "ask" = "vibe", "accept_edits" = "", "auto" = "", "full_access" = ""}
blind_set_mode = false
native_execution = false
permission_policy = "acp"
require_mcp_http = false
mode_meta = {}
session_meta = "none"
launch_extra = "none"
probe_initialize = true
usage_input_includes_cache = false
usage_prompt_cumulative = false
usage_fallback = "none"
fallback_models = []
fallback_efforts = []
model_fallback = false
fast_models = ["haiku", "luna", "qwen"]
resume_cli = "kiro-cli chat --resume-id {id}"
outer_sandbox_args = []

[[adapters]]
id = "mistral-vibe"
