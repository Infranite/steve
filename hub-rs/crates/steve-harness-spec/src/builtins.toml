detect_bins = ["claude", "claude-code-acp"]
args = []
command_var = "STEVE_ADAPTER_CLAUDE"
env = {}
command = {"kind" = "claude"}
local_transcript = true
primary = true
managed_by_default = true
[adapters.properties]
self_read_only = false
nested_sandbox = true
state = {"env" = "CLAUDE_CONFIG_DIR", "default" = ".claude", "import" = ["settings.json"], "context" = ["CLAUDE.md", "skills/*", "agents", "commands", "output-styles"], "login" = {"files" = [".credentials.json"], "renew" = [".storage-write.lock", ".credentials.json.tmp.*"], "store_env" = "CLAUDE_SECURESTORAGE_CONFIG_DIR", "settings" = "settings.json", "entries" = ["apiKeyHelper", "awsAuthRefresh", "awsCredentialExport", "forceLoginMethod", "forceLoginOrgUUID", "env.ANTHROPIC_*", "env.CLAUDE_CODE_USE_*", "env.AWS_*", "env.CLOUD_ML_REGION", "env.VERTEX_REGION_*"]}, "home_files" = [".claude.json"]}
