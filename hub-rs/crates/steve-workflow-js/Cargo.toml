[package]
name = "steve-workflow-js"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Sandboxed QuickJS (rquickjs) single-step replay interpreter for Steve workflow scripts"

[dependencies]
rquickjs = "=0.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
steve-workflow-api = { path = "../steve-workflow-api" }
