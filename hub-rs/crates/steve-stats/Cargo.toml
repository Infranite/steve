[package]
name = "steve-stats"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
steve-runtime = { path = "../steve-runtime" }
steve-acp = { path = "../steve-acp" }
steve-store = { path = "../steve-store" }
steve-i18n = { path = "../steve-i18n" }
rust-i18n = "=4.2.4"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "=0.10.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.54.1", features = ["time", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
steve-store = { path = "../steve-store", features = ["testkit"] }
steve-node-api = { path = "../steve-node-api" }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["time", "rt", "macros"] }
