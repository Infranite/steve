[package]
name = "steve-node-api"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "The Hub-Node contract (docs/node-protocol.md): typed ids, run specs, Steve events, errors and the async ports. No store, no core, no agent protocol."

[features]
# An in-memory Node for tests of the Hub side (`testkit::FakeNode`).
testkit = []

[dependencies]
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
hex = "=0.4.3"

[dev-dependencies]
# The contract tests use the fake Node: a plain `cargo test --workspace` runs them too.
steve-node-api = { path = ".", features = ["testkit"] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
