[package]
name = "steve-transcript"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "A session's transcript in Steve's own terms (steve.v1), from Node events."

[dependencies]
steve-node-api = { path = "../steve-node-api" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
