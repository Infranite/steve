[package]
name = "steve-install"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Native Steve installation, service management and release maintenance"

[[bin]]
name = "steve"
path = "src/main.rs"

[dependencies]
steve-harness-spec = { path = "../steve-harness-spec" }
steve-i18n = { path = "../steve-i18n" }
steve-runtime = { path = "../steve-runtime", default-features = false, features = ["process"] }
steve-store = { path = "../steve-store" }
steve-types = { path = "../steve-types" }
rust-i18n = "=4.2.4"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
data-encoding = "=2.11.1"
hex = "=0.4.3"
uuid = { version = "=1.29.0", features = ["v4"] }
zeroize = "=1.9.1"
libc = "0.2"
semver = "=1.0.28"
url = "=2.5.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
regex = "=1.13.1"
shlex = "=2.0.1"
plist = "=1.8.0"
zip = { version = "=9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
steve-runtime = { path = "../steve-runtime", default-features = false, features = ["testkit"] }
steve-store = { path = "../steve-store", features = ["testkit"] }
tempfile = "=3.27.0"
