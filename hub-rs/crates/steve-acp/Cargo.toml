[package]
name = "steve-acp"
description = "ACP client for Steve: adapter processes over stdio"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
steve-i18n = { path = "../steve-i18n" }
rust-i18n = "=4.2.4"
# Steve's events: what the ACP updates are translated into (normalize.rs).
steve-node-api = { path = "../steve-node-api" }
steve-vault = { path = "../steve-vault" }
base64 = "=0.23.1"
libc = "=0.2.191"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "process", "time", "sync", "io-util", "macros"] }
tracing = "=0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "test-util"] }
