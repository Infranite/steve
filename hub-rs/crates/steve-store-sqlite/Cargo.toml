[package]
name = "steve-store-sqlite"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Steve's built-in SQLite implementation of the storage contract: engines, executor, schema, backup"

[dependencies]
steve-types = { path = "../steve-types" }
steve-storage-api = { path = "../steve-storage-api" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks"] }
# Compressed backups (W2a backup).
flate2 = "=1.1.10"
