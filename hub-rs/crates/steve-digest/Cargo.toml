[package]
name = "steve-digest"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "The digest base: conversation profiles, windows, digest packets, matters and personal todos"

[dependencies]
steve-store = { path = "../steve-store" }
# Source adapter reuses channel visibility rather than widening personal-account access.
steve-channels = { path = "../steve-channels" }
steve-modules = { path = "../steve-modules" }
steve-knowledge = { path = "../steve-knowledge" }
steve-i18n = { path = "../steve-i18n" }
rust-i18n = "=4.2.4"
axum = { version = "=0.8.9", default-features = false, features = ["json", "query"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
