[package]
name = "steve-print"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "One model run of a harness CLI in print mode (claude -p, codex exec): arguments, process, stream parsing and usage as Node reports. No tiers, no fallback, no store, no core."

[dependencies]
base64 = "=0.23.1"
# `preserve_order`: `modelUsage` rows keep the harness's order, and a stream-json user message keeps its key order.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
steve-node-api = { path = "../steve-node-api" }
tokio = { version = "=1.54.1", features = ["rt", "macros", "process", "time", "fs", "io-util"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }
