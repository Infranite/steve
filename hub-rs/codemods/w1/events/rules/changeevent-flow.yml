id: changeevent-flow
language: Rust
message: Migrate ChangeEvent::Flow; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Flow { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::AutomationEvent::Flow { $$$FIELDS })'
