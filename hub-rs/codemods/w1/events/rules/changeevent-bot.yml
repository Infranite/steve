id: changeevent-bot
language: Rust
message: Migrate ChangeEvent::Bot; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Bot { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::ConfigEvent::Bot { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
