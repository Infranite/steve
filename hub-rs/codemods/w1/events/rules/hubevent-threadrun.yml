id: hubevent-threadrun
language: Rust
message: Migrate HubEvent::ThreadRun; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::ThreadRun { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::WorkEvent::ThreadRun { $$$FIELDS })'
