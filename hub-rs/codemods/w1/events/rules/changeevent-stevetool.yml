id: changeevent-stevetool
language: Rust
message: Migrate ChangeEvent::SteveTool; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::SteveTool { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::LiveEvent::from(steve_types::WorkLiveEvent::SteveTool { $$$FIELDS })'
