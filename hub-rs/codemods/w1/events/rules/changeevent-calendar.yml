id: changeevent-calendar
language: Rust
message: Migrate ChangeEvent::Calendar; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Calendar { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::AutomationEvent::Calendar { $$$FIELDS })'
