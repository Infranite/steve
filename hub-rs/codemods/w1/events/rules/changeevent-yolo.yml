id: changeevent-yolo
language: Rust
message: Migrate ChangeEvent::Yolo; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Yolo { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::AutonomyEvent::Yolo { $$$FIELDS }.into()'
