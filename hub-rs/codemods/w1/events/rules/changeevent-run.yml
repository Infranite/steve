id: changeevent-run
language: Rust
message: Migrate ChangeEvent::Run; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Run { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::AutomationEvent::Run { $$$FIELDS })'
