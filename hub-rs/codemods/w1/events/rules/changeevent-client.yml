id: changeevent-client
language: Rust
message: Migrate ChangeEvent::Client; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Client { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DevicesEvent::Client { $$$FIELDS }.into()'
