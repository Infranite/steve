id: changeevent-project
language: Rust
message: Migrate ChangeEvent::Project; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Project { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::ConfigEvent::Project { ws: steve_types::ws_todo!(), $$$FIELDS })'
