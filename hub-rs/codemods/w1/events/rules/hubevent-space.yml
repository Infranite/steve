id: hubevent-space
language: Rust
message: Migrate HubEvent::Space; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Space { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::ChannelsEvent::Space { $$$FIELDS })'
