id: changeevent-workspace
language: Rust
message: Migrate ChangeEvent::Workspace; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Workspace { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::ConfigEvent::Workspace { ws: steve_types::ws_todo!(), $$$FIELDS })'
