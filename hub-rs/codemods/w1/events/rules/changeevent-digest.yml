id: changeevent-digest
language: Rust
message: Migrate ChangeEvent::Digest; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Digest { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::ChannelsEvent::Digest { $$$FIELDS }.into()'
