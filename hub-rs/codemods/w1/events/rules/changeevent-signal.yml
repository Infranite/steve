id: changeevent-signal
language: Rust
message: Migrate ChangeEvent::Signal; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Signal { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::AutomationEvent::Signal { $$$FIELDS }.into()'
