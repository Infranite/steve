id: changeevent-account
language: Rust
message: Migrate ChangeEvent::Account; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Account { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::PeopleEvent::Account { $$$FIELDS }.into()'
