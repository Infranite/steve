id: changeevent-party
language: Rust
message: Migrate ChangeEvent::Party; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Party { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::PeopleEvent::Party { $$$FIELDS }.into()'
