id: hubevent-project
language: Rust
message: Migrate HubEvent::Project; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Project { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::ConfigEvent::Project { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
