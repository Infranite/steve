id: changeevent-decision
language: Rust
message: Migrate ChangeEvent::Decision; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Decision { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::WorkEvent::Decision { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
