id: hubevent-tag
language: Rust
message: Migrate HubEvent::Tag; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Tag { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::ConfigEvent::Tag { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
