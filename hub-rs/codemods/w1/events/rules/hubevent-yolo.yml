id: hubevent-yolo
language: Rust
message: Migrate HubEvent::Yolo; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Yolo { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::AutonomyEvent::Yolo { $$$FIELDS })'
