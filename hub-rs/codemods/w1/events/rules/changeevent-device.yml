id: changeevent-device
language: Rust
message: Migrate ChangeEvent::Device; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Device { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::DevicesEvent::Device { $$$FIELDS })'
