id: hubevent-vault
language: Rust
message: Migrate HubEvent::Vault; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Vault { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::VaultEvent::Vault { $$$FIELDS }.into()'
