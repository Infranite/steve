id: hubevent-stats
language: Rust
message: Migrate HubEvent::Stats; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Stats { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::StatsEvent::Stats { $$$FIELDS })'
