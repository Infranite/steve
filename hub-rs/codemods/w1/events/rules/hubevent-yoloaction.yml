id: hubevent-yoloaction
language: Rust
message: Migrate HubEvent::YoloAction; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::YoloAction { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::AutonomyEvent::YoloAction { $$$FIELDS })'
