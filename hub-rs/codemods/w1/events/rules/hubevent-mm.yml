id: hubevent-mm
language: Rust
message: Migrate HubEvent::Mm; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Mm { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::ConfigEvent::Mm { $$$FIELDS })'
