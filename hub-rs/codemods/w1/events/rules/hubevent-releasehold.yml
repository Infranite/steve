id: hubevent-releasehold
language: Rust
message: Migrate HubEvent::ReleaseHold; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::ReleaseHold { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::DevicesEvent::ReleaseHold { $$$FIELDS })'
