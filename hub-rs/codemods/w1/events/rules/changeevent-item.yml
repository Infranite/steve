id: changeevent-item
language: Rust
message: Migrate ChangeEvent::Item; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Item { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?ChangeEvent$'
fix: 'steve_types::WorkEvent::Item { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
