id: hubevent-session
language: Rust
message: Migrate HubEvent::Session; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Session { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::DomainEvent::from(steve_types::WorkEvent::Session { ws: steve_types::ws_todo!(), $$$FIELDS })'
