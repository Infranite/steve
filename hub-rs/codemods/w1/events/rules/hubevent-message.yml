id: hubevent-message
language: Rust
message: Migrate HubEvent::Message; run.py also converts field types.
severity: hint
rule:
  pattern: '$ENUM::Message { $$$FIELDS }'
  kind: struct_expression
constraints:
  ENUM:
    regex: '^(.*::)?HubEvent$'
fix: 'steve_types::WorkEvent::Message { ws: steve_types::ws_todo!(), $$$FIELDS }.into()'
