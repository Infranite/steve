id: hubevent-workspace
valid:
  - "fn f() { let _ = Other::Workspace { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Workspace { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Workspace { id: id }); }"
  - "fn f() { send(s::HubEvent::Workspace { ws, id: make(\"comma,colon:\") }); }"
