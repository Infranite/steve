id: hubevent-yoloaction
valid:
  - "fn f() { let _ = Other::YoloAction { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::YoloAction { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::YoloAction { id: id }); }"
  - "fn f() { send(s::HubEvent::YoloAction { ws, id: make(\"comma,colon:\") }); }"
