id: hubevent-connection
valid:
  - "fn f() { let _ = Other::Connection { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Connection { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Connection { id: id }); }"
  - "fn f() { send(s::HubEvent::Connection { ws, id: make(\"comma,colon:\") }); }"
