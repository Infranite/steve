id: hubevent-session
valid:
  - "fn f() { let _ = Other::Session { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Session { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Session { id: id }); }"
  - "fn f() { send(s::HubEvent::Session { ws, id: make(\"comma,colon:\") }); }"
