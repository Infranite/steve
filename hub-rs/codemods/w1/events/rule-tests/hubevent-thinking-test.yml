id: hubevent-thinking
valid:
  - "fn f() { let _ = Other::SteveThinking { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Thinking { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Thinking { id: id }); }"
  - "fn f() { send(s::HubEvent::Thinking { ws, id: make(\"comma,colon:\") }); }"
