id: hubevent-stevethinking
valid:
  - "fn f() { let _ = Other::SteveThinking { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::SteveThinking { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::SteveThinking { id: id }); }"
  - "fn f() { send(s::HubEvent::SteveThinking { ws, id: make(\"comma,colon:\") }); }"
