id: hubevent-persona
valid:
  - "fn f() { let _ = Other::Persona { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Persona { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Persona { id: id }); }"
  - "fn f() { send(s::HubEvent::Persona { ws, id: make(\"comma,colon:\") }); }"
