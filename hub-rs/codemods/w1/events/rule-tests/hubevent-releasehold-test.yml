id: hubevent-releasehold
valid:
  - "fn f() { let _ = Other::ReleaseHold { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::ReleaseHold { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::ReleaseHold { id: id }); }"
  - "fn f() { send(s::HubEvent::ReleaseHold { ws, id: make(\"comma,colon:\") }); }"
