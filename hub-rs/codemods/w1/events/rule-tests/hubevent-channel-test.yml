id: hubevent-channel
valid:
  - "fn f() { let _ = Other::Channel { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Channel { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Channel { id: id }); }"
  - "fn f() { send(s::HubEvent::Channel { ws, id: make(\"comma,colon:\") }); }"
