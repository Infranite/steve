id: changeevent-signal
valid:
  - "fn f() { let _ = Other::Signal { id: id }; }"
  - "fn f(e: ChangeEvent) { match e { ChangeEvent::Signal { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(ChangeEvent::Signal { id: id }); }"
  - "fn f() { send(s::ChangeEvent::Signal { ws, id: make(\"comma,colon:\") }); }"
