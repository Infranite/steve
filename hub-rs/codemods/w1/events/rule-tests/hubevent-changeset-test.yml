id: hubevent-changeset
valid:
  - "fn f() { let _ = Other::Changeset { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Changeset { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Changeset { id: id }); }"
  - "fn f() { send(s::HubEvent::Changeset { ws, id: make(\"comma,colon:\") }); }"
