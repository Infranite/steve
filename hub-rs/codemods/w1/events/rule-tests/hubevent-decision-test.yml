id: hubevent-decision
valid:
  - "fn f() { let _ = Other::Decision { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Decision { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Decision { id: id }); }"
  - "fn f() { send(s::HubEvent::Decision { ws, id: make(\"comma,colon:\") }); }"
