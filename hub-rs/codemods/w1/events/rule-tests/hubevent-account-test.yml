id: hubevent-account
valid:
  - "fn f() { let _ = Other::Account { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Account { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Account { id: id }); }"
  - "fn f() { send(s::HubEvent::Account { ws, id: make(\"comma,colon:\") }); }"
