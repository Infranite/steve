id: changeevent-account
valid:
  - "fn f() { let _ = Other::Account { id: id }; }"
  - "fn f(e: ChangeEvent) { match e { ChangeEvent::Account { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(ChangeEvent::Account { id: id }); }"
  - "fn f() { send(s::ChangeEvent::Account { ws, id: make(\"comma,colon:\") }); }"
