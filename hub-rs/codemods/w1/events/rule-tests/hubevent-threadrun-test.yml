id: hubevent-threadrun
valid:
  - "fn f() { let _ = Other::ThreadRun { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::ThreadRun { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::ThreadRun { id: id }); }"
  - "fn f() { send(s::HubEvent::ThreadRun { ws, id: make(\"comma,colon:\") }); }"
