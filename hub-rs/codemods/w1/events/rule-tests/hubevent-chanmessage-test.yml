id: hubevent-chanmessage
valid:
  - "fn f() { let _ = Other::ChanMessage { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::ChanMessage { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::ChanMessage { id: id }); }"
  - "fn f() { send(s::HubEvent::ChanMessage { ws, id: make(\"comma,colon:\") }); }"
