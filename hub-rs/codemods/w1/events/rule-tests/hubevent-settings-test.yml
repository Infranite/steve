id: hubevent-settings
valid:
  - "fn f() { let _ = Other::Settings { id: id }; }"
  - "fn f(e: HubEvent) { match e { HubEvent::Settings { .. } => (), _ => () } }"
invalid:
  - "fn f() { send(HubEvent::Settings { id: id }); }"
  - "fn f() { send(s::HubEvent::Settings { ws, id: make(\"comma,colon:\") }); }"
