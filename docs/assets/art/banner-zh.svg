<style>

.bob{animation:bob 4.6s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.eyes{animation:look 9s ease-in-out infinite}
.ant{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
@keyframes look{0%,35%{transform:translateX(0)}42%,58%{transform:translateX(-11px)}65%,82%{transform:translateX(11px)}90%,100%{transform:translateX(0)}}
@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.glow{animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-24px)}}
.wire{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.row{opacity:0;animation:rise .8s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
.caret{animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
</style>
