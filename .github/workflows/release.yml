name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Verify public boundary
        run: |
          python3 scripts/check-public-boundary.py --strict
          python3 scripts/test-public-boundary.py
          python3 scripts/test-package-release.py
      - run: npm ci
      - run: npm run check && npm run test:web && npm run build:web
      - name: Rust tests
        run: cargo test --locked --manifest-path hub-rs/Cargo.toml --workspace --no-fail-fast
      - name: Build Hub
        shell: bash
        run: STEVE_RELEASE_VERSION="${GITHUB_REF_NAME#v}" STEVE_RELEASE_COMMIT="$GITHUB_SHA" cargo build --locked --release --manifest-path hub-rs/Cargo.toml -p steve-hub
      - name: Package matching Hub and Web
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/package-release.py package --version "$version" --commit "$GITHUB_SHA" \
            --target "$TARGET" --binary hub-rs/target/release/steve-hub \
            --web web/dist --out release-assets
      - name: Verify actual release binary identity and health
        run: python3 ops/test-release-identity.py hub-rs/target/release/steve-hub --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true
      - name: Verify and assemble manifest
        run: python3 scripts/package-release.py merge --expected-target aarch64-apple-darwin --expected-target x86_64-unknown-linux-gnu --out release-assets/steve-release.json release-assets/manifest-*.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Published assets are immutable; publish a new version"'
          else
            notes="docs/releases/${GITHUB_REF_NAME#v}.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Steve $GITHUB_REF_NAME" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Steve $GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/steve-release.json release-assets/*.tar.gz --clobber
          mkdir verified-assets
          gh release download "$GITHUB_REF_NAME" --dir verified-assets --pattern 'steve-*'
          cp release-assets/manifest-*.json verified-assets/
          python3 scripts/package-release.py merge --out verified-assets/verified.json verified-assets/manifest-*.json
          cmp verified-assets/verified.json verified-assets/steve-release.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
