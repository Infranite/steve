name: Release
# Build, package and publish the tagged commit. Its tests ran before the tag: ops/cut-release.py tags only
# a main whose CI workflow (ci.yml) passed. A build here that fails on something passing (a runner
# hiccup) is run again on the same tag with `gh run rerun <run id> --failed`: nothing is published
# before every target built, so the version is not lost.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:web && npm run build:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-web
          path: web/dist
          if-no-files-found: error
          retention-days: 2
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target/release
          key: rust-release-v1-${{ matrix.runner }}-${{ runner.arch }}-1.99.1-${{ hashFiles('hub-rs/Cargo.lock', 'hub-rs/Cargo.toml') }}-${{ github.sha }}
          restore-keys: rust-release-v1-${{ matrix.runner }}-${{ runner.arch }}-1.99.1-${{ hashFiles('hub-rs/Cargo.lock', 'hub-rs/Cargo.toml') }}-
      - name: Always rebuild release workspace packages from this checkout
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile release
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Verify public boundary
        run: |
          python3 scripts/check-public-boundary.py --strict
          python3 scripts/test-public-boundary.py
          python3 scripts/test-package-release.py
      - name: Release gate
        run: |
          python3 ops/test-schema-gate.py
          python3 ops/test-local-release-journal.py
          python3 ops/test-local-release-prune.py
          python3 ops/test-prepare-bundle.py
          python3 ops/test-steve-service.py
          python3 -m py_compile ops/local-release.py ops/test-local-release.py
          bash ops/check-migration-lock.sh "$GITHUB_REF_NAME"
      - name: Build Hub, Node and keyhelper
        shell: bash
        run: STEVE_RELEASE_VERSION="${GITHUB_REF_NAME#v}" STEVE_RELEASE_COMMIT="$GITHUB_SHA" cargo build --locked --release --manifest-path hub-rs/Cargo.toml -p steve-hub -p steve-node-cli -p steve-keyhelper
      - name: Verify actual release binary identity and health
        run: python3 ops/test-release-identity.py hub-rs/target/release/steve-hub --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" --target "${{ matrix.target }}"
      - name: Preserve executable modes for packaging
        run: tar -cf release-binaries.tar -C hub-rs/target/release steve-hub steve-node steve-keyhelper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: release-binaries.tar
          if-no-files-found: error
          retention-days: 2
      - name: Keep only dependency artifacts in the cache
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile release
  package:
    needs: [web, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-web
          path: web/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-${{ matrix.target }}
      - run: mkdir release-binaries && tar -xf release-binaries.tar -C release-binaries
      - name: Package matching Hub, Node, Web and runtime scripts
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/package-release.py package --version "$version" --commit "$GITHUB_SHA" \
            --target "$TARGET" --binary release-binaries/steve-hub \
            --node release-binaries/steve-node --keyhelper release-binaries/steve-keyhelper \
            --web web/dist --out release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true
      - name: Verify and assemble manifest
        run: python3 scripts/package-release.py merge --expected-target aarch64-apple-darwin --expected-target x86_64-unknown-linux-gnu --out release-assets/steve-release.json release-assets/manifest-*.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Published assets are immutable; publish a new version"'
          else
            notes="docs/releases/${GITHUB_REF_NAME#v}.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Steve $GITHUB_REF_NAME" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Steve $GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/steve-release.json release-assets/*.tar.gz --clobber
          mkdir verified-assets
          gh release download "$GITHUB_REF_NAME" --dir verified-assets --pattern 'steve-*'
          cp release-assets/manifest-*.json verified-assets/
          python3 scripts/package-release.py merge --out verified-assets/verified.json verified-assets/manifest-*.json
          cmp verified-assets/verified.json verified-assets/steve-release.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
