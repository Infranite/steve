name: CI
# Each platform runs the Rust tests in parallel shards, one runner each (RUST_TEST_SHARDS below); a last
# job per platform proves that together they ran every test exactly once and it passed on its first try.
# Every job has a time limit of two to several times its longest run, so one that hangs is stopped
# there instead of holding a runner for GitHub's six hours. When GitHub cannot give a macOS job a runner
# at all it cancels the job itself, with no step run; the `CI rerun` workflow (ci-rerun.yml) reruns such
# a run on main.
# A pull request into main runs the Linux jobs (and the Apple job only when it touches the apps, the web
# client they bundle or this workflow); macOS runners are scarce and were the queue every PR waited in. A push to main
# and a merge queue run cover both platforms, with three macOS jobs: two Rust shards (the first also runs the
# release and boundary scripts) and the Apple job. The web checks are the same TypeScript on both, so Linux runs them. Main pushes share one running and at most one pending run;
# a newer push replaces the pending run without stopping the running one. Merge queue runs stay independent.
# cut-release.py releases the newest main commit whose own push run passed, with its release notes on top,
# so nothing reaches a release untested on macOS. Branch rules on main
# require the `CI gate` check, by that name. `merge_group` lets GitHub's own merge queue run it too.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
env:
  # How many runners share each platform's Rust tests (`--partition hash:k/N`). Linux runners are
  # plentiful; macOS ones are scarce (and run only on main), so it takes fewer of them.
  RUST_TEST_SHARDS: '{"ubuntu-22.04": 4, "macos-15": 2}'
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The same checks run on macOS in the first macOS Rust shard, which saves a macOS runner.
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Pull request title and release metadata
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ops/cut-release.py lint --github-event "$GITHUB_EVENT_PATH"
      - name: Install Linux test prerequisites
        run: sh scripts/install-ci-zsh.sh
      - name: Boundary and release scripts
        run: sh scripts/ci-script-checks.sh
  # Linux only: the type checks, unit tests and build are the same TypeScript on every platform, and the
  # Apple job builds the web client again on macOS for the apps.
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:web && npm run build:web
      # Fast browser tests (<= CI_SMOKE_THRESHOLD_S = 30 s on CI, SMOKE in web/test/browser-smoke.mjs):
      # they answer the API themselves and need no Hub. Slow browser tests (> 30 s on CI) run in `browser-extended` below.
      - name: Browser smoke tests
        timeout-minutes: 10
        run: |
          npx playwright install --only-shell chromium
          npm run test:web:browser-smoke
  # Slow browser tests (> CI_SMOKE_THRESHOLD_S = 30 s on CI, EXTENDED in web/test/browser-smoke.mjs):
  # sharded across parallel Linux runners by test count so each shard stays under 8 minutes; run only when web files change.
  browser-extended:
    name: browser-extended (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' && needs.changes.outputs.web != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shards: [2]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Extended browser tests (${{ matrix.shard }}/${{ matrix.shards }})
        timeout-minutes: 10
        run: |
          npx playwright install --only-shell chromium
          npm run test:web:browser-extended -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
  # A push or pull request that changed only release notes (cut-release.py's release pull request, and the
  # merge commit that brings it into main) repeats the Rust jobs of the commit it stands on. This job waits for CI on that commit
  # and, when it passed, lets them be skipped. Merge queue runs do not run it, and always run the Rust jobs.
  changes:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45 # the script itself stops waiting after 40
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      apple: ${{ steps.paths.outputs.apple }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Whether the Apple apps or extended browser tests need running
        id: paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt; then
              if grep -qE '^(apple/|web/|package(-lock)?\.json$|scripts/build-apple-client\.sh$|\.github/workflows/ci\.yml$)' files.txt; then echo "apple=true"; else echo "apple=false"; fi >> "$GITHUB_OUTPUT"
              if grep -qE '^(web/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)' files.txt; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"
            else
              echo "apple=true" >> "$GITHUB_OUTPUT"
              echo "web=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "apple=true" >> "$GITHUB_OUTPUT"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" --jq '.files[].filename' > files.txt; then
              if grep -qE '^(web/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)' files.txt; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"
            else
              echo "web=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Skip the Rust jobs when only release notes changed and CI passed on the commit it stands on
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/skip-rust-jobs.py
  # The Rust tests of each platform run in parallel shards (`--partition hash:k/N`, N from RUST_TEST_SHARDS):
  # every shard compiles the workspace's tests from its own checkout and runs its share, and `rust` proves
  # from every shard's list and report that each test ran exactly once and passed on its first try.
  # Nothing is handed between runners but lists and reports.
  rust-plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: The shard matrix of every platform this run tests
        id: plan
        env:
          RUNNERS: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "macos-15"]' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          shards = json.loads(os.environ['RUST_TEST_SHARDS'])
          print('shards=' + json.dumps([dict(runner=runner, shard=k, shards=shards[runner])
                                        for runner in json.loads(os.environ['RUNNERS'])
                                        for k in range(1, shards[runner] + 1)]))
          PY
  rust-test:
    name: rust-test (${{ matrix.runner }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, rust-plan]
    # Only `skip=true` from `changes` skips the Rust jobs: they run when it was skipped itself or did not finish.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' && needs.rust-plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rust-plan.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Linux builds without debug info: that halved compiling the workspace's tests (464 s with line
    # tables, 213 s without, on otherwise identical runners). Panic messages still carry file and line,
    # and a backtrace, when RUST_BACKTRACE asks for one, still names functions (symbols stay). macOS keeps
    # line tables: its linker leaves them in the object files anyway, and without them Cargo strips the
    # debug info of the standard library from every test binary, which made the integration tests slower
    # to build there (their units took 696 s of build time with line tables, 929 to 1248 s without).
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: ${{ startsWith(matrix.runner, 'ubuntu') && '0' || 'line-tables-only' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ startsWith(matrix.runner, 'ubuntu') && '0' || 'line-tables-only' }}
      PARTITION: hash:${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # The `scripts` job's checks, on macOS, before compiling: they need nothing built and fail within a minute.
      - name: Boundary and release scripts (macOS)
        if: runner.os == 'macOS' && matrix.shard == 1
        run: sh scripts/ci-script-checks.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt
      # Formatting needs no build, so one shard checks it before compiling and fails within seconds.
      - name: Rust formatting (cargo fmt --check)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: cargo fmt --manifest-path hub-rs/Cargo.toml --all --check
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sh scripts/install-ci-zsh.sh
      # The key names everything that decides how dependencies are built: platform, toolchain, lockfile,
      # every manifest (profiles, features) and this file (its env sets profile options). main saves a
      # cache only for a key that has none, and starts that one from nothing so it holds no leftovers.
      # A pull request whose key has no cache yet starts from main's newest one for its platform.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target/debug
          key: rust-test-v1-${{ matrix.runner }}-${{ runner.arch }}-1.99.1-${{ hashFiles('hub-rs/Cargo.lock', 'hub-rs/Cargo.toml', 'hub-rs/crates/*/Cargo.toml', '.github/workflows/ci.yml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('rust-test-v1-{0}-{1}-1.99.1-', matrix.runner, runner.arch) || '' }}
      - name: Always rebuild workspace packages from this checkout
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile dev
      - name: Install checksum-pinned nextest from the official release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/install-nextest.py
      # The full list is this build's whole inventory; the shard's list differs from it only in which
      # tests the partition selects.
      - name: Compile all Rust tests and record the inventory
        id: rust-build
        run: |
          mkdir -p ci-artifacts
          cargo nextest run --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --no-run --timings
          cargo nextest list --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --message-format json > ci-artifacts/full.json
          cargo nextest list --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --partition "$PARTITION" --message-format json > ci-artifacts/list.json
          cp hub-rs/target/cargo-timings/cargo-timing.html ci-artifacts/
      - name: Stage the bundled backup engine for end-to-end tests
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 scripts/package-release.py restic --target "$target" --out hub-rs/target/debug
          cp -p hub-rs/target/debug/restic hub-rs/target/debug/deps/restic
      - name: Rust tests
        id: rust-tests
        run: cargo nextest run --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --retries 0 --no-fail-fast --partition "$PARTITION"
      - name: Rust test report (first-attempt failures remain failures)
        if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
        run: |
          python3 scripts/nextest-summary.py hub-rs/target/nextest/ci/junit.xml
          cp hub-rs/target/nextest/ci/junit.xml ci-artifacts/
      # The doctests are not partitioned: the first shard of each platform runs all of them.
      - name: Rust doctests (reuse the compiled workspace)
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' && matrix.shard == 1 }}
        run: cargo test --locked --manifest-path hub-rs/Cargo.toml --workspace --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
        with:
          name: rust-shard-${{ matrix.runner }}-${{ matrix.shard }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: error
      # Only third-party dependencies enter the trusted cache. Workspace artifacts always come
      # from this checkout, even when cache fingerprints or file timestamps would allow reuse.
      # A failing test does not keep a built dependency set from being cached. Every shard builds
      # the same dependencies; the first one saves them.
      - name: Keep only dependency artifacts in the cache
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile dev
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && matrix.shard == 1 && github.event_name == 'push' && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  # Proves for each platform that its shards together ran the entire test inventory, each test exactly
  # once and passing on its first try: every shard's build must list the same binaries and tests as the
  # first shard's. It reads only lists and reports, so it runs on Linux for both platforms.
  rust:
    needs: [changes, rust-test]
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "macos-15"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-shard-${{ matrix.runner }}-*
          path: rust-results
      - name: Verify the entire test inventory ran exactly once and passed on the first try
        env:
          SHARDS: ${{ fromJSON(env.RUST_TEST_SHARDS)[matrix.runner] }}
          RESULTS: rust-results/rust-shard-${{ matrix.runner }}
        run: |
          set -- "$RESULTS-1/full.json"
          for k in $(seq 1 "$SHARDS"); do set -- "$@" "$RESULTS-$k/list.json"; done
          for k in $(seq 1 "$SHARDS"); do set -- "$@" --junit "$RESULTS-$k/junit.xml"; done
          python3 scripts/nextest-partitions.py "$@"
  # The macOS and iOS apps: the Swift package's tests, then both apps built unsigned around the web
  # client of this commit (the iOS one for the simulator, which needs no signing identity).
  # Skipped with the Rust jobs when only release notes changed.
  apple:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' && needs.changes.outputs.apple != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the web client the apps bundle
        run: npm run build:web
      - name: Swift package tests
        run: scripts/build-apple-client.sh test
      - name: Build SteveMac
        run: scripts/build-apple-client.sh mac
      - name: Build SteveIOS for the simulator
        run: scripts/build-apple-client.sh ios-sim
  postgres-contract:
    name: PostgreSQL storage contract
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: steve_contract
          POSTGRES_USER: steve_contract
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U steve_contract -d steve_contract"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Migrate and run storage contracts against PostgreSQL
        working-directory: hub-rs
        env:
          STEVE_TEST_POSTGRES_URL: "host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=steve_contract user=steve_contract connect_timeout=5"
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked -p steve-store --lib -- --ignored contract::postgres::tests::postgres_contract
  test:
    name: CI gate
    # Always runs, so a cancelled run reports a failed gate: branch rules take a skipped required check
    # as passed. A superseded run's failure stays on its own commit and never touches the newer one's.
    if: ${{ always() }}
    needs: [changes, scripts, web, browser-extended, rust-plan, rust-test, rust, apple, postgres-contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every job on every platform
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'changes', 'scripts', 'web', 'browser-extended', 'rust-plan', 'rust-test', 'rust', 'apple', 'postgres-contract'}, results
          changes = results.pop('changes')
          assert changes['result'] in ('success', 'skipped'), changes
          # Rust, PostgreSQL, Apple and extended browser tests may skip release-notes-only changes after a successful base run.
          if changes['result'] == 'success' and changes['outputs'].get('skip') == 'true':
              for job in ('rust-test', 'rust', 'apple', 'postgres-contract', 'browser-extended'):
                  assert results.pop(job)['result'] in ('success', 'skipped'), results
          else:
              # A pull request that does not touch the apps skips the Apple job, on the word of `changes` only.
              if changes['result'] == 'success' and changes['outputs'].get('apple') == 'false':
                  assert results.pop('apple')['result'] in ('success', 'skipped'), results
              # Extended browser tests (> 30 s) run only when web files change, on the word of `changes` only.
              if changes['result'] == 'success' and changes['outputs'].get('web') == 'false':
                  assert results.pop('browser-extended')['result'] in ('success', 'skipped'), results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
