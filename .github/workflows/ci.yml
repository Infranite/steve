name: CI
# One Rust job per platform compiles the workspace's tests and runs all of them on that runner.
# Every job has a time limit of two to several times its longest run, so one that hangs is stopped
# there instead of holding a runner for GitHub's six hours.
# cut-release.py accepts only this entire workflow's successful run: the push run on the release head, or the
# run of the pull request that head was merged from when it tested the same tree.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Verify public boundary
        run: |
          python3 scripts/check-public-boundary.py --strict
          python3 scripts/test-public-boundary.py
          python3 scripts/test-package-release.py
          python3 packaging/homebrew/test-sync.py
          python3 scripts/test-install-nextest.py
      - name: Release scripts
        run: |
          python3 ops/test-schema-gate.py
          python3 ops/test-local-release-journal.py
          python3 ops/test-local-release-prune.py
          python3 ops/test-prepare-bundle.py
          python3 ops/test-steve-service.py
          python3 ops/test-upgrade.py
          python3 ops/test-cut-release.py
          python3 -m py_compile ops/local-release.py ops/test-local-release.py ops/upgrade.py
          bash ops/check-migration-lock.sh
          python3 scripts/test-nextest-summary.py
          python3 scripts/test-nextest-partitions.py
          python3 scripts/test-skip-rust-jobs.py
  web:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:web && npm run build:web
  # A push that changed only release notes (the commit cut-release.py pushes) repeats the Rust jobs of the
  # commit before it. This job waits for CI on that commit and, when it passed, lets them be skipped.
  # Pull requests do not run it, and always run the Rust jobs.
  changes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45 # the script itself stops waiting after 40
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip the Rust jobs when only release notes changed and CI passed on the commit before
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/skip-rust-jobs.py
  rust:
    needs: changes
    # Only `skip=true` from `changes` skips them: they run when it was skipped itself or did not finish.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      # The key names everything that decides how dependencies are built: platform, toolchain, lockfile,
      # every manifest (profiles, features) and this file (its env sets profile options). main saves a
      # cache only for a key that has none, and starts that one from nothing so it holds no leftovers.
      # A pull request whose key has no cache yet starts from main's newest one for its platform.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target/debug
          key: rust-test-v1-${{ matrix.runner }}-${{ runner.arch }}-1.99.1-${{ hashFiles('hub-rs/Cargo.lock', 'hub-rs/Cargo.toml', 'hub-rs/crates/*/Cargo.toml', '.github/workflows/ci.yml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('rust-test-v1-{0}-{1}-1.99.1-', matrix.runner, runner.arch) || '' }}
      - name: Always rebuild workspace packages from this checkout
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile dev
      - name: Install checksum-pinned nextest from the official release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/install-nextest.py
      - name: Compile all Rust tests and record the inventory
        id: rust-build
        run: |
          mkdir -p ci-artifacts
          cargo nextest run --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --no-run --timings
          cargo nextest list --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --message-format json > ci-artifacts/full.json
      - name: Rust tests
        id: rust-tests
        run: cargo nextest run --locked --manifest-path hub-rs/Cargo.toml --workspace --profile ci --retries 0 --no-fail-fast
      - name: Rust test report (first-attempt failures remain failures)
        if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
        run: python3 scripts/nextest-summary.py hub-rs/target/nextest/ci/junit.xml
      - name: Verify the entire test inventory ran exactly once and passed on the first try
        run: python3 scripts/nextest-partitions.py ci-artifacts/full.json ci-artifacts/full.json --junit hub-rs/target/nextest/ci/junit.xml
      - name: Rust doctests (reuse the compiled workspace)
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' }}
        run: cargo test --locked --manifest-path hub-rs/Cargo.toml --workspace --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
        with:
          name: rust-results-${{ matrix.runner }}
          path: |
            ci-artifacts/full.json
            hub-rs/target/nextest/ci/junit.xml
            hub-rs/target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: error
      # Only third-party dependencies enter the trusted cache. Workspace artifacts always come
      # from this checkout, even when cache fingerprints or file timestamps would allow reuse.
      # A failing test does not keep a built dependency set from being cached.
      - name: Keep only dependency artifacts in the cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo clean --locked --manifest-path hub-rs/Cargo.toml --workspace --profile dev
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && github.event_name == 'push' && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hub-rs/target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  # The macOS and iOS apps: the Swift package's tests, then both apps built unsigned around the web
  # client of this commit (the iOS one for the simulator, which needs no signing identity).
  # Skipped with the Rust jobs when only release notes changed.
  apple:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the web client the apps bundle
        run: npm run build:web
      - name: Swift package tests
        run: scripts/build-apple-client.sh test
      - name: Build SteveMac
        run: scripts/build-apple-client.sh mac
      - name: Build SteveIOS for the simulator
        run: scripts/build-apple-client.sh ios-sim
  test:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, scripts, web, rust, apple]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every job on every platform
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'changes', 'scripts', 'web', 'rust', 'apple'}, results
          changes = results.pop('changes')
          assert changes['result'] in ('success', 'skipped'), changes
          # The Rust and Apple jobs may be skipped only on the word of `changes`; everything else must have passed.
          if changes['result'] == 'success' and changes['outputs'].get('skip') == 'true':
              for job in ('rust', 'apple'):
                  assert results.pop(job)['result'] in ('success', 'skipped'), results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
